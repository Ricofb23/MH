<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HCE Móvil - Asistente IA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2, h3 { margin-bottom: 15px; }
    .hidden { display: none !important; }
    input, select, button, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .timer { font-size: 28px; font-weight: bold; text-align: center; color: var(--danger); margin: 10px 0; }
    .preview-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
    #resumenOutput { white-space: pre-wrap; background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 14px; max-height: 250px; overflow-y: auto; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. LOGIN -->
  <div id="loginScreen" class="card">
    <h2>HCE Móvil IA</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">Inicia sesión con tu cuenta profesional</p>
    <input type="email" id="loginEmail" placeholder="Correo electrónico" value="dr.gomez@clinica.com">
    <input type="password" id="loginPass" placeholder="Contraseña" value="123456">
    <button type="button" id="btnLogin">Ingresar al Sistema</button>
  </div>

  <!-- 2. PANTALLA PRINCIPAL -->
  <div id="appScreen" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <div>
        <h3 id="userGreeting" style="margin:0;">Bienvenido</h3>
        <small id="userSpecialty" style="color:#64748b;">Especialidad: -</small>
      </div>
      <button type="button" id="btnLogout" style="width:auto; padding:6px 12px; font-size:12px;" class="btn-danger">Salir</button>
    </div>

    <div style="margin-bottom: 15px;">
      <input type="password" id="apiKeyInput" placeholder="Pega aquí tu clave API creada en Google AI Studio" style="font-size: 12px; padding: 8px;">
    </div>

    <hr style="margin-bottom:15px; border:none; border-top:1px solid #e2e8f0;">

    <div style="text-align:center;">
      <h3>Grabación de Consulta</h3>
      <div id="recordingTimer" class="timer hidden">00:00</div>
      <button type="button" id="btnStartRecord">🎙️️ Iniciar Grabación de Consulta</button>
      <button type="button" id="btnStopRecord" class="btn-danger hidden">⏹️ Detener y Procesar con IA</button>
    </div>

    <div style="margin-top:20px;">
      <h3>Adjuntar Estudio / Foto</h3>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
      <img id="imgPreview" class="preview-img hidden" alt="Vista previa">
      <small id="imgInfo" style="color:#64748b;"></small>
    </div>

    <div id="resultSection" class="hidden" style="margin-top:20px;">
      <h3>Resumen Clínico (IA)</h3>
      <div id="resumenOutput">Esperando audio...</div>
      <button type="button" id="btnPdf" style="margin-top:15px;" class="btn-success">📄 Generar Receta / Orden Médica (PDF)</button>
    </div>
  </div>

</div>
<script>
  // Cargar clave guardada en localStorage apenas abre la app
  document.addEventListener("DOMContentLoaded", () => {
    const savedKey = localStorage.getItem("groq_api_key");
    if (savedKey) {
      document.getElementById("apiKeyInput").value = savedKey;
    }

    // Escuchar cuando el usuario escribe en la casilla para auto-guardar
    document.getElementById("apiKeyInput").addEventListener("input", (e) => {
      const keyVal = e.target.value.trim();
      localStorage.setItem("groq_api_key", keyVal);
    });
  });

  async function procesarAudioConIA() {
    const apiKeyInput = document.getElementById('apiKeyInput');
    const apiKey = apiKeyInput.value.trim();
    const resumenOutput = document.getElementById('resumenOutput');
    document.getElementById('resultSection').classList.remove('hidden');

    if (!apiKey) {
      resumenOutput.innerText = "⚠️ Ingrese su API Key de Groq (gsk_...) en la casilla superior.";
      return;
    }

    if (!apiKey.startsWith('gsk_')) {
      resumenOutput.innerText = "⚠️ La clave ingresada no parece de Groq. Debe comenzar con 'gsk_'. Obténla gratis en console.groq.com";
      return;
    }

    // Aseguramos que quede guardada en el navegador
    localStorage.setItem("groq_api_key", apiKey);

    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    
    try {
      // PASO 1: Transcribir el audio usando Whisper Large v3 en Groq
      resumenOutput.innerText = "🎙️ Transcribiendo audio con Whisper...";
      
      const formData = new FormData();
      formData.append('file', audioBlob, 'consulta.webm');
      formData.append('model', 'whisper-large-v3-turbo');
      formData.append('language', 'es');
      formData.append('response_format', 'json');

      const transRes = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`
        },
        body: formData
      });

      if (!transRes.ok) {
        const errJson = await transRes.json();
        throw new Error(`Error transcripción (${transRes.status}): ${errJson.error?.message || 'Fallo de audio'}`);
      }

      const transData = await transRes.json();
      const transcripcionTexto = transData.text;

      if (!transcripcionTexto || transcripcionTexto.trim() === '') {
        resumenOutput.innerText = "⚠️ No se detectó voz clara en la grabación. Intente grabar nuevamente.";
        return;
      }

      // PASO 2: Estructurar la historia clínica con Llama 3.3 70B
      resumenOutput.innerText = `⚡ Generando informe clínico...\nPerfil: ${usuarioActivo.especialidad}`;

      const promptSistema = `Eres un asistente médico experto. Transforma la transcripción de la consulta médica en un informe clínico formal.
Especialidad médica: ${usuarioActivo.especialidad}
Parámetros a extraer: ${usuarioActivo.prompt}

Instrucciones: Usa formato Markdown profesional con negritas y viñetas. Incluye secciones claras: Motivo de consulta, Anamnesis, Medicación habitual, Alergias, Examen físico, Diagnóstico e Indicaciones. Si un dato no se menciona en el audio, indica "No refiere" o "No realizado".`;

      const llamaRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [
            { role: 'system', content: promptSistema },
            { role: 'user', content: `Transcripción del audio de la consulta:\n"${transcripcionTexto}"` }
          ],
          temperature: 0.2
        })
      });

      if (!llamaRes.ok) {
        const errJson = await llamaRes.json();
        throw new Error(`Error IA (${llamaRes.status}): ${errJson.error?.message || 'Fallo al procesar'}`);
      }

      const llamaData = await llamaRes.json();
      const resumenFinal = llamaData.choices[0].message.content;

      resumenOutput.innerText = resumenFinal;

    } catch (error) {
      resumenOutput.innerText = "❌ Error en el proceso: " + error.message;
    }
  }
</script>

</body>
</html>
