<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HCE Móvil - Asistente IA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2, h3 { margin-bottom: 15px; }
    .hidden { display: none !important; }
    input, select, button, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .timer { font-size: 28px; font-weight: bold; text-align: center; color: var(--danger); margin: 10px 0; }
    .preview-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
    #resumenOutput { white-space: pre-wrap; background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 14px; max-height: 250px; overflow-y: auto; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. LOGIN -->
  <div id="loginScreen" class="card">
    <h2>HCE Móvil IA</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">Inicia sesión con tu cuenta profesional</p>
    <input type="email" id="loginEmail" placeholder="Correo electrónico" value="dr.gomez@clinica.com">
    <input type="password" id="loginPass" placeholder="Contraseña" value="123456">
    <button type="button" id="btnLogin">Ingresar al Sistema</button>
  </div>

  <!-- 2. PANTALLA PRINCIPAL -->
  <div id="appScreen" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <div>
        <h3 id="userGreeting" style="margin:0;">Bienvenido</h3>
        <small id="userSpecialty" style="color:#64748b;">Especialidad: -</small>
      </div>
      <button type="button" id="btnLogout" style="width:auto; padding:6px 12px; font-size:12px;" class="btn-danger">Salir</button>
    </div>

    <div style="margin-bottom: 15px;">
      <input type="password" id="apiKeyInput" placeholder="Clave API de Gemini (AI Studio)" style="font-size: 12px; padding: 8px;">
    </div>

    <hr style="margin-bottom:15px; border:none; border-top:1px solid #e2e8f0;">

    <div style="text-align:center;">
      <h3>Grabación de Consulta</h3>
      <div id="recordingTimer" class="timer hidden">00:00</div>
      <button type="button" id="btnStartRecord">🎙️️ Iniciar Grabación de Consulta</button>
      <button type="button" id="btnStopRecord" class="btn-danger hidden">⏹️ Detener y Procesar con IA</button>
    </div>

    <div style="margin-top:20px;">
      <h3>Adjuntar Estudio / Foto</h3>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
      <img id="imgPreview" class="preview-img hidden" alt="Vista previa">
      <small id="imgInfo" style="color:#64748b;"></small>
    </div>

    <div id="resultSection" class="hidden" style="margin-top:20px;">
      <h3>Resumen Clínico (IA)</h3>
      <div id="resumenOutput">Esperando audio...</div>
      <button type="button" id="btnPdf" style="margin-top:15px;" class="btn-success">📄 Generar Receta / Orden Médica (PDF)</button>
    </div>
  </div>

</div>

<script>
  const usuariosDB = {
    "dr.gomez@clinica.com": {
      nombre: "Dr. Juan Gómez",
      especialidad: "Clínica Médica",
      matricula: "MP-48201",
      prompt: "Extrae: Motivo de consulta, Anamnesis / Antecedentes patológicos, Medicación Habitual, Alergias / RAM, Signos vitales dictados, Examen físico por sistemas, Diagnóstico e Indicaciones."
    },
    "dra.martinez@clinica.com": {
      nombre: "Dra. María Martínez",
      especialidad: "Odontología",
      matricula: "MN-12904",
      prompt: "Extrae: Piezas dentales afectadas, Motivo de consulta, Sintomatología, Procedimiento en sillón y Plan de tratamiento."
    }
  };

  let usuarioActivo = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let timerInterval = null;
  let segundos = 0;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btnLogin').addEventListener('click', iniciarSesion);
    document.getElementById('btnLogout').addEventListener('click', cerrarSesion);
    document.getElementById('btnStartRecord').addEventListener('click', iniciarGrabacion);
    document.getElementById('btnStopRecord').addEventListener('click', detenerGrabacion);
    document.getElementById('cameraInput').addEventListener('change', procesarImagen);
    document.getElementById('btnPdf').addEventListener('click', generarDocumentoPDF);
  });

  function iniciarSesion() {
    const email = document.getElementById('loginEmail').value.trim();
    if (usuariosDB[email]) {
      usuarioActivo = usuariosDB[email];
      document.getElementById('userGreeting').innerText = usuarioActivo.nombre;
      document.getElementById('userSpecialty').innerText = `Especialidad: ${usuarioActivo.especialidad} (${usuarioActivo.matricula})`;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
    } else {
      alert("Usuario no registrado. Usa: dr.gomez@clinica.com");
    }
  }

  function cerrarSesion() {
    usuarioActivo = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
  }

  async function iniciarGrabacion() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = procesarAudioConIA;

      mediaRecorder.start();
      
      document.getElementById('btnStartRecord').classList.add('hidden');
      document.getElementById('btnStopRecord').classList.remove('hidden');
      document.getElementById('recordingTimer').classList.remove('hidden');
      
      segundos = 0;
      timerInterval = setInterval(() => {
        segundos++;
        let min = String(Math.floor(segundos / 60)).padStart(2, '0');
        let sec = String(segundos % 60).padStart(2, '0');
        document.getElementById('recordingTimer').innerText = `${min}:${sec}`;
      }, 1000);

    } catch (err) {
      alert("Error al acceder al micrófono: " + err.message);
    }
  }

  function detenerGrabacion() {
    if (mediaRecorder) mediaRecorder.stop();
    clearInterval(timerInterval);
    document.getElementById('btnStartRecord').classList.remove('hidden');
    document.getElementById('btnStopRecord').classList.add('hidden');
    document.getElementById('recordingTimer').classList.add('hidden');
  }

  async function procesarAudioConIA() {
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    const resumenOutput = document.getElementById('resumenOutput');
    document.getElementById('resultSection').classList.remove('hidden');

    if (!apiKey) {
      resumenOutput.innerText = "⚠️ Ingrese su API Key de Google AI Studio en la casilla superior.";
      return;
    }

    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    resumenOutput.innerText = `⏳ Procesando audio con Gemini 1.5 Flash...\nAplicando perfil: ${usuarioActivo.especialidad}`;

    try {
      const base64Audio = await blobToBase64(audioBlob);
      const audioDataOnly = base64Audio.split(',')[1];

      const promptTexto = `Eres un asistente médico clínico. Escucha la siguiente consulta médica y redacta un resumen estructurado.
Especialidad médica: ${usuarioActivo.especialidad}
Parámetros a extraer: ${usuarioActivo.prompt}

Escribe en formato profesional con viñetas. Incluye: Motivo, Anamnesis, Medicación Habitual, Alergias, Examen Físico, Diagnóstico e Indicaciones.`;

      const bodyData = {
        contents: [{
          parts: [
            { text: promptTexto },
            { inline_data: { mime_type: "audio/webm", data: audioDataOnly } }
          ]
        }]
      };

      // Modelo oficial y compatible: gemini-1.5-flash
      let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      });

      const data = await response.json();

      if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
        resumenOutput.innerText = data.candidates[0].content.parts[0].text;
      } else {
        const detalleError = data.error ? `${data.error.status} - ${data.error.message}` : JSON.stringify(data);
        resumenOutput.innerText = `❌ Error de la API (${response.status}):\n${detalleError}`;
      }

    } catch (error) {
      resumenOutput.innerText = "❌ Error de conexión/red: " + error.message;
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function procesarImagen(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1000;
        const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleSize;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const imgData = canvas.toDataURL('image/jpeg', 0.7);
        const preview = document.getElementById('imgPreview');
        preview.src = imgData;
        preview.classList.remove('hidden');
        
        const sizeKB = Math.round((imgData.length * 3 / 4) / 1024);
        document.getElementById('imgInfo').innerText = `Imagen comprimida: ~${sizeKB} KB`;
      }
    };
    reader.readAsDataURL(file);
  }

  function generarDocumentoPDF() {
    const { jsPDF } = window.jspdf;
    if (!jsPDF) { alert("Error cargando jsPDF."); return; }

    const textoResumen = document.getElementById('resumenOutput').innerText;
    if (!textoResumen || textoResumen.includes("Esperando audio...") || textoResumen.includes("❌")) {
      alert("Procesa una consulta antes de generar el PDF.");
      return;
    }

    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });
    const fecha = new Date().toLocaleDateString('es-ES');

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.setTextColor(2, 132, 199);
    doc.text(usuarioActivo.nombre, 15, 20);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    doc.text(`Especialidad: ${usuarioActivo.especialidad}`, 15, 25);
    doc.text(`Matrícula: ${usuarioActivo.matricula}`, 15, 29);
    doc.text(`Fecha: ${fecha}`, 105, 20);

    doc.setDrawColor(226, 232, 240);
    doc.line(15, 33, 133, 33);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(15, 23, 42);
    doc.text("RESUMEN DE CONSULTA / INDICACIONES", 15, 42);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(30, 41, 59);

    const lineasTexto = doc.splitTextToSize(textoResumen, 118);
    doc.text(lineasTexto, 15, 50);

    doc.setLineWidth(0.3);
    doc.line(85, 190, 133, 190);
    doc.setFontSize(8);
    doc.setTextColor(100, 116, 139);
    doc.text("Firma y Sello del Profesional", 88, 194);

    doc.save(`Consulta_${fecha.replace(/\//g, '-')}.pdf`);
  }
</script>

</body>
</html>
